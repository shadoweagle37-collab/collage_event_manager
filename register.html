</head>

<!-- ================= HERO ================= -->

<section class="hero">

    <div class="hero-content">

        <h1>

            Event Registration

        </h1>

        <p>

            Complete the form below to reserve your seat.

        </p>

    </div>

</section>

<!-- ================= FORM ================= -->

<section class="form-section">

    <h2 class="form-title">

        Student Registration Form

    </h2>

    <form id="registrationForm">

        <div class="form-grid">

            <!-- Full Name -->

            <div class="form-group">

                <label for="name">

                    Full Name

                </label>

                <input
                    type="text"
                    id="name"
                    autocomplete="off">

                <small class="error"
                       id="nameError"></small>

            </div>

            <!-- Email -->

            <div class="form-group">

                <label for="email">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="off">

                <small class="error"
                       id="emailError"></small>

            </div>

            <!-- Phone -->

            <div class="form-group">

                <label for="phone">

                    Phone Number

                </label>

                <input
                    type="tel"
                    id="phone">

                <small class="error"
                       id="phoneError"></small>

            </div>

            <!-- Department -->

            <div class="form-group">

                <label for="department">

                    Department

                </label>

                <select id="department">

                    <option value="">

                        Select Department

                    </option>

                    <option>Computer Science</option>

                    <option>Information Technology</option>

                    <option>Mechanical</option>

                    <option>Civil</option>

                    <option>Electrical</option>

                    <option>Commerce</option>

                    <option>Arts</option>

                </select>

                <small class="error"
                       id="departmentError"></small>

            </div>

            <!-- Year -->

            <div class="form-group">

                <label for="year">

                    Year

                </label>

                <select id="year">

                    <option value="">Select Year</option>

                    <option>First</option>

                    <option>Second</option>

                    <option>Third</option>

                    <option>Fourth</option>

                </select>

                <small class="error"
                       id="yearError"></small>

            </div>

            <!-- Event -->

            <div class="form-group">

                <label for="event">

                    Select Event

                </label>

                <select id="event">

                    <option value="">

                        Loading Events...

                    </option>

                </select>

                <small class="error"
                       id="eventError"></small>

            </div>

            <!-- Gender -->

            <div class="form-group full-width">

                <label>

                    Gender

                </label>

                <div class="radio-group">

                    <label>

                        <input
                            type="radio"
                            name="gender"
                            value="Male">

                        Male

                    </label>

                    <label>

                        <input
                            type="radio"
                            name="gender"
                            value="Female">

                        Female

                    </label>

                    <label>

                        <input
                            type="radio"
                            name="gender"
                            value="Other">

                        Other

                    </label>

                </div>

                <small class="error"
                       id="genderError"></small>

            </div>

            <!-- Address -->

            <div class="form-group full-width">

                <label for="address">

                    Address

                </label>

                <textarea
                    id="address"></textarea>

                <small class="error"
                       id="addressError"></small>

            </div>

            <!-- Roll Number -->

            <div class="form-group">

                <label for="roll">

                    College Roll Number

                </label>

                <input
                    type="text"
                    id="roll">

                <small class="error"
                       id="rollError"></small>

            </div>

            <!-- Emergency Contact -->

            <div class="form-group">

                <label for="emergency">

                    Emergency Contact

                </label>

                <input
                    type="tel"
                    id="emergency">

                <small class="error"
                       id="emergencyError"></small>

            </div>

            <!-- Terms -->

            <div class="form-group full-width">

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="terms">

                    <label for="terms">

                        I agree to the Terms &
                        Conditions

                    </label>

                </div>

                <small class="error"
                       id="termsError"></small>

            </div>

        </div>

        <button
            type="submit"
            class="btn primary-btn submit-btn">

            <i class="fa-solid fa-paper-plane"></i>

            Register Now

        </button>

    </form>

</section>
